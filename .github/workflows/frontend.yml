# =============================================================================
# GitHub Actions Workflow - Frontend Deployment
# =============================================================================
# Builds Next.js static site and deploys to S3 + CloudFront

name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:  # Allow manual triggers

env:
  AWS_REGION: us-west-2
  NODE_VERSION: '20'

permissions:
  id-token: write   # Required for OIDC
  contents: write   # Required to commit README changes

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_GATEWAY_URL }}
        run: npm run build

      - name: Sync to S3
        working-directory: frontend
        run: |
          # First, sync all static assets with long cache (hashed filenames)
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "_next/data/*"
          
          # HTML files with no cache
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "*.html"
          
          # _next/data JSON files with no cache
          aws s3 sync out/_next/data/ s3://${{ secrets.S3_BUCKET_NAME }}/_next/data/ \
            --cache-control "no-cache, no-store, must-revalidate" \
            2>/dev/null || true

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Get CloudFront Domain
        id: cloudfront
        run: |
          DOMAIN=$(aws cloudfront get-distribution --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --query 'Distribution.DomainName' --output text)
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "url=https://$DOMAIN" >> $GITHUB_OUTPUT

      - name: Update README with Live URL
        run: |
          FRONTEND_URL="${{ steps.cloudfront.outputs.url }}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          # Create the new content
          cat << EOF > /tmp/deploy_status.md
          
          | 🌐 **Live Site** | $FRONTEND_URL |
          |-----------------|---------------|
          | 📅 Last Deploy | $TIMESTAMP |
          | 🔖 Commit | \`${{ github.sha }}\` |
          EOF
          
          # Update README between markers
          awk -v content="$(cat /tmp/deploy_status.md)" '
            /<!-- FRONTEND_DEPLOY_START -->/ {
              print
              print content
              skip = 1
              next
            }
            /<!-- FRONTEND_DEPLOY_END -->/ {
              skip = 0
            }
            !skip
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit README changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update live frontend URL [skip ci]"
            git pull --no-rebase origin main || true
            git push
          fi

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | ${{ steps.cloudfront.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **S3 Bucket** | ${{ secrets.S3_BUCKET_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **CloudFront** | ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
